# Builds and tests AirSQL on a GitHub-hosted Mac (Apple silicon) for every push to main and every pull request: libmariadb
# (scripts/build-mariadb.sh, cached by its hash), the debug build without warnings, the Swift Testing suite, and the
# universal app with its signature checked. The lab (AIRSQL_LAB=1, Docker) isn't here: it runs on the maintainer's Mac.
name: CI

# Runs on pull requests and when one merges into main (the badge shows main), and by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request replaces its run. Every other run (main) has a group of its own and finishes: a
# cancelled run shows as "failing" on the README's badge.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# bash with pipefail, so that `… | tee log` fails when the command does.
defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # AirSQL builds with the Command Line Tools alone (no Xcode project); the runner has them next to Xcode.
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
      # The linker's note that SwiftPM's own search paths under the Command Line Tools don't exist: not the code's.
      TOOLCHAIN_NOISE: "ld: warning: search path '/Library/Developer/CommandLineTools/Developer/"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's newest Command Line Tools default to macOS 27's SDK, whose SwiftUI needs a macro plugin that only
      # Xcode has (@State: "plugin for module 'SwiftUIMacros' not found"). Build with the macOS 26 SDK they also ship.
      - name: macOS 26 SDK (and Xcode 26 for the tests)
        run: |
          ls /Library/Developer/CommandLineTools/SDKs
          sdk=$(ls -d /Library/Developer/CommandLineTools/SDKs/MacOSX26*.sdk 2>/dev/null | sort -V | tail -n 1)
          [ -n "$sdk" ] || { echo "::error::no macOS 26 SDK in the Command Line Tools (listed above)"; exit 1; }
          echo "SDKROOT=$sdk" >> "$GITHUB_ENV"
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          [ -n "$xcode" ] || { echo "::error::No Xcode 26 on this runner"; exit 1; }
          echo "XCODE26=$xcode/Contents/Developer" >> "$GITHUB_ENV"

      # Saved right after it is built, so that a run failing later doesn't build it again next time.
      - name: Restore libmariadb
        id: mariadb
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/out
          key: mariadb-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-mariadb.sh') }}

      - name: Build libmariadb (only when the cache missed)
        if: steps.mariadb.outputs.cache-hit != 'true'
        run: scripts/build-mariadb.sh

      - name: Save libmariadb
        if: steps.mariadb.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/out
          key: mariadb-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-mariadb.sh') }}

      - name: swift build (no warnings)
        run: |
          mkdir -p build
          swift build 2>&1 | tee build/swift-build.log
          if grep 'warning:' build/swift-build.log | grep -qv "$TOOLCHAIN_NOISE"; then
            echo "::error::swift build has warnings (above)"
            exit 1
          fi

      # With Xcode 26's Swift: these Command Line Tools lack Swift Testing's macro plugin ('TestingMacros').
      - name: Tests (./test.sh)
        run: |
          export DEVELOPER_DIR=$XCODE26
          unset SDKROOT
          ./test.sh

      - name: App, universal (./build.sh)
        run: ./build.sh

      # The universal app and its library, signed inside out, and the bundle's own libmariadb loads (an @rpath or
      # signature mistake would stop the app before it prints).
      - name: The app is universal, signed, and loads its libmariadb
        run: |
          app=build/AirSQL.app
          for file in "$app/Contents/MacOS/AirSQL" "$app/Contents/Frameworks/libmariadb.3.dylib"; do
            for arch in arm64 x86_64; do
              lipo "$file" -verify_arch "$arch" || { echo "::error::$file has no $arch slice"; exit 1; }
            done
          done
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/AirSQL" --version | tee build/version.txt
          grep -q 'MariaDB Connector/C 3\.4\.' build/version.txt || { echo "::error::the app doesn't report libmariadb 3.4"; exit 1; }
