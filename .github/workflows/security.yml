# gitleaks looks for secrets in every commit of every branch (.gitleaks.toml lists its verified false positives): on
# pushes to main, pull requests and by hand. Any finding fails the run. The scan of the bundled libraries
# (Connector/C, OpenSSL) for known vulnerabilities joins it with the SBOM, as in AirSCP's security.yml.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request replaces its run. Every other run has a group of its own and finishes: a cancelled
# run (even one still waiting for an earlier one) shows as "failing" on the README's badge.
concurrency:
  group: security-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# bash with pipefail.
defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets in the git history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # every commit of every branch
          persist-credentials: false

      - name: gitleaks 8.30.1
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: gitleaks on every commit
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .
